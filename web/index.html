<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://cctvjss.jogjakota.go.id" crossorigin />
    <link rel="preconnect" href="https://cctv.jogjaprov.go.id" crossorigin />
    <title>CCTV Jogja</title>
    <script>
      // Mirrors resolveTheme() in src/lib/theme.ts; runs before paint to avoid a flash.
      try {
        var stored = localStorage.getItem('cctv-theme');
        var dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
